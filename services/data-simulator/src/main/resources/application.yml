spring:
  application:
    name: data-simulator
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

simulador:
  # Default global de frecuencia por sensor (segundos) si el sensor no trae la suya.
  frecuencia-reporte-segundos: 30
  ruido:
    sigma-metros: 0.05
  anomalia:
    segundos: 10
    # El salto debe garantizar AC-005 de FEAT-0010 en cualquier fase del dia:
    # nivelBase - amplitudDiaria(0.5) + salto > rangoNormalMax.
    # Con 2.0, PARANA-RECONQUISTA (base 5.1 / max 7.0) daba 6.6-7.6 segun la hora y
    # FEAT0010MainFlowIT fallaba de noche; con 3.0 el piso es 7.6.
    salto-metros: 3.0
  lecturas:
    exchange: sensor.lecturas
    # FIX-0006 BR-001: version del schema del evento (configuracion, nunca hardcodeada en consumidores)
    schema-version: ${SIMULADOR_SCHEMA_VERSION:1.0}
  sensores:
    - codigo: PARANA-RECONQUISTA
      nombre: Reconquista
      unidadMedida: METROS
      nivelBase: 5.1
      rangoNormalMax: 7.0
    - codigo: PARANA-SANTAFE
      nombre: Puerto de Santa Fe
      unidadMedida: METROS
      nivelBase: 5.3
      rangoNormalMax: 7.0
    - codigo: PARANA-ROSARIO
      nombre: Rosario
      unidadMedida: METROS
      nivelBase: 5.0
      rangoNormalMax: 7.0
    - codigo: SALADO-SANJUSTO
      nombre: San Justo (R.P. 2)
      unidadMedida: METROS
      nivelBase: 9.0
      rangoNormalMax: 11.0
    - codigo: SALADO-RECREO
      nombre: Recreo (R.P. 70)
      unidadMedida: METROS
      nivelBase: 4.7
      rangoNormalMax: 6.5
    - codigo: SALADO-SANTOTOME
      nombre: Santo Tomé
      unidadMedida: METROS
      nivelBase: 4.7
      rangoNormalMax: 6.5

logging:
  level:
    com.wrsensor.datasimulator: INFO
