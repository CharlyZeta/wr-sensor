spring:
  application:
    name: ingestion-service
  r2dbc:
    url: ${INGESTION_R2DBC_URL:r2dbc:postgresql://localhost:5433/wrsensor_ingestion}
    username: ${R2DBC_USER:wrsensor}
    password: ${R2DBC_PASS:wrsensor}
    pool:
      enabled: true
      max-size: 10
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

ingestion:
  ventana-segundos: 300
  registry:
    base-url: ${REGISTRY_URL:http://localhost:8080}
    auth:
      email: ${REGISTRY_AUTH_EMAIL:viewer@wrsensor.local}
      password: ${REGISTRY_AUTH_PASSWORD:Viewer123!}
  lecturas:
    exchange: sensor.lecturas
    queue: queue.sensor.lecturas
    dlq-queue: queue.sensor.lecturas.dlq
    dlx: sensor.lecturas.dlx
  alertas:
    exchange: sensor.alertas
  messaging:
    retry-max-attempts: 3
    dead-letter-exchange: sensor.lecturas.dlx
  # FIX-0003: publisher de outbox (nunca hardcodeado; BR-004..BR-008)
  outbox:
    intervalo-ms: 1000
    tamano-lote: 50
    max-intentos: 5
    backoff-inicial-ms: 1000
    multiplicador: 2.0
    backoff-max-ms: 30000
    retencion-dias: 90

logging:
  level:
    com.wrsensor.ingestion: INFO

