spring:
  application:
    name: ingestion-service
  r2dbc:
    url: ${INGESTION_R2DBC_URL:r2dbc:postgresql://localhost:5433/wrsensor_ingestion}
    username: ${R2DBC_USER:wrsensor}
    password: ${R2DBC_PASS:wrsensor}
    pool:
      enabled: true
      max-size: 10
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

ingestion:
  ventana-segundos: 300
  registry:
    base-url: ${REGISTRY_URL:http://localhost:8080}
    auth:
      email: ${REGISTRY_AUTH_EMAIL:viewer@wrsensor.local}
      password: ${REGISTRY_AUTH_PASSWORD:Viewer123!}
  lecturas:
    exchange: sensor.lecturas
    dlq-queue: queue.sensor.lecturas.dlq
    dlx: sensor.lecturas.dlx
  # FIX-0005: particionamiento del consumo por sensorId (nunca hardcodeado; BR-003/BR-004).
  # La cola de consumo se deriva del patron: queue.sensor.lecturas.p0 .. p{total-1}.
  # Asignacion por instancia: INGESTION_PARTICIONES_ASIGNADAS=0,1 (default: todas).
  particiones:
    total: ${INGESTION_PARTICIONES_TOTAL:4}
    exchange: ${INGESTION_PARTICIONES_EXCHANGE:sensor.lecturas.part}
    patron: ${INGESTION_PARTICIONES_PATRON:queue.sensor.lecturas.p{i}}
    # asignadas: [0, 1]   # descomentar para limitar el consumo de esta instancia
  alertas:
    exchange: sensor.alertas
  messaging:
    retry-max-attempts: 3
    dead-letter-exchange: sensor.lecturas.dlx
  # FIX-0004: rangos fisicos por unidad (nunca hardcodeados; BR-001/BR-002)
  # Overrides por sensor: claves = sensorId (UUID) o codigo.
  rango-fisico:
    unidades:
      METROS:      { min: -1.0,  max: 15.0 }
      CENTIMETROS: { min: -100,  max: 1500 }
    # Overrides opcionales (si se omiten, rige el global de la unidad):
    # overrides:
    #   PARANA-RECONQUISTA: { min: 0.0, max: 8.0 }

  # FIX-0006: version del schema del evento (BR-001/BR-006/BR-007). Tolerancia hacia adelante
  # por default: una version mayor desconocida se procesa con WARN; con false se rechaza a la
  # DLQ con motivo SCHEMA_UNSUPPORTED.
  schema:
    version-soportada: ${INGESTION_SCHEMA_VERSION:1.0}
    tolerar-versiones-mayores: ${INGESTION_SCHEMA_TOLERAR_MAYORES:true}

  # FIX-0003: publisher de outbox (nunca hardcodeado; BR-004..BR-008)
  outbox:
    intervalo-ms: 1000
    tamano-lote: 50
    max-intentos: 5
    backoff-inicial-ms: 1000
    multiplicador: 2.0
    backoff-max-ms: 30000
    retencion-dias: 90

logging:
  level:
    com.wrsensor.ingestion: INFO



