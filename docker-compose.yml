name: wrsensor

services:
  # ===== Infraestructura =====
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: wrsensor
      RABBITMQ_DEFAULT_PASS: wrsensor
    # FIX-0005 BR-009: el exchange type x-consistent-hash (particionamiento por sensorId)
    # viene incluido en la distribucion de RabbitMQ pero hay que habilitarlo explicitamente.
    volumes:
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-metadata:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wrsensor
      POSTGRES_USER: wrsensor
      POSTGRES_PASSWORD: wrsensor
    ports: ["5432:5432"]
    volumes: [pg-metadata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrsensor -d wrsensor"]
      interval: 10s
      timeout: 5s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: wrsensor_ingestion
      POSTGRES_USER: wrsensor
      POSTGRES_PASSWORD: wrsensor
    ports: ["5433:5432"]
    volumes: [pg-timescale:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrsensor -d wrsensor_ingestion"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== Servicios (requieren `mvn -o install -DskipTests` previo en services/) =====
  # FEAT-0007 BR-012: solo api-gateway publica puerto al host. Para debug directo usar
  # docker-compose.dev.yml (ver docs/RUNBOOK.md).
  sensor-registry:
    build: ./services/sensor-registry
    environment:
      R2DBC_URL: r2dbc:postgresql://postgres-metadata:5432/wrsensor
      R2DBC_USER: wrsensor
      R2DBC_PASS: wrsensor
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: wrsensor
      RABBIT_PASS: wrsensor
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-wrsensor-dev-secret-2026-no-usar-en-prod}
    depends_on:
      postgres-metadata: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  data-simulator:
    build: ./services/data-simulator
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: wrsensor
      SPRING_RABBITMQ_PASSWORD: wrsensor
    depends_on:
      rabbitmq: { condition: service_healthy }
      sensor-registry: { condition: service_started }

  ingestion-service:
    build: ./services/ingestion-service
    environment:
      INGESTION_R2DBC_URL: r2dbc:postgresql://timescaledb:5432/wrsensor_ingestion
      R2DBC_USER: wrsensor
      R2DBC_PASS: wrsensor
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: wrsensor
      SPRING_RABBITMQ_PASSWORD: wrsensor
      REGISTRY_URL: http://sensor-registry:8080
      REGISTRY_AUTH_EMAIL: viewer@wrsensor.local
      REGISTRY_AUTH_PASSWORD: Viewer123!
      # FIX-0005: particiones del consumo. Para escalar con `--scale`, cada instancia
      # necesita su propio subconjunto: INGESTION_PARTICIONES_ASIGNADAS=0 / 1 / 2,3
      # (ver docs/RUNBOOK.md §Escalado horizontal de ingestion).
      INGESTION_PARTICIONES_TOTAL: 4
    depends_on:
      timescaledb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      sensor-registry: { condition: service_started }

  alerting-service:
    build: ./services/alerting-service
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: wrsensor
      SPRING_RABBITMQ_PASSWORD: wrsensor
    depends_on:
      rabbitmq: { condition: service_healthy }

  query-api:
    build: ./services/query-api
    environment:
      QUERY_R2DBC_URL: r2dbc:postgresql://timescaledb:5432/wrsensor_ingestion
      R2DBC_USER: wrsensor
      R2DBC_PASS: wrsensor
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: wrsensor
      SPRING_RABBITMQ_PASSWORD: wrsensor
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-wrsensor-dev-secret-2026-no-usar-en-prod}
    depends_on:
      timescaledb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # Punto de entrada unico (FEAT-0007): enruta REST y WS, aplica rate limiting y correlacion.
  # FEAT-0009: la imagen tambien construye el SPA (stage de Node) y lo sirve desde /app/static/,
  # por eso el contexto de build es la raiz del repo (necesita ver web/).
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports: ["8084:8084"]
    environment:
      REGISTRY_URL: http://sensor-registry:8080
      QUERY_API_URL: http://query-api:8082
      ALERTING_URL: http://alerting-service:8083
      GATEWAY_CONFIAR_XFF: ${GATEWAY_CONFIAR_XFF:-false}
      # FIX-0008 BR-001 (hallazgo S1): el gateway valida el JWT del handshake WebSocket, así que
      # DEBE recibir el mismo secreto que el registry. Sin esta variable caía al default de
      # desarrollo (público en el repo) y cualquiera podía forjar un token ADMIN/VIEWER.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-wrsensor-dev-secret-2026-no-usar-en-prod}
      # FEAT-0009 BR-010: el SPA viene del stage de Node y se monta fuera del jar.
      GATEWAY_STATIC_LOCATION: file:/app/static/
    depends_on:
      sensor-registry: { condition: service_started }
      query-api: { condition: service_started }
      alerting-service: { condition: service_started }

volumes:
  pg-metadata:
  pg-timescale:
